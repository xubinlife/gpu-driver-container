name: image-custom

on:
  workflow_dispatch:
    inputs:
      driver_version:
        default: "470.256.02"
        required: true
      dist:
        default: "ubuntu24.04"
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build driver image
        env:
          IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/driver
          VERSION: ""
          PUSH_ON_BUILD: "true"
          BUILD_MULTI_ARCH_IMAGES: "false"
        run: |
          DRIVER_VERSIONS=${{ inputs.driver_version }} \
          make build-${{ inputs.dist }}-${{ inputs.driver_version }}

          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/driver:${{ inputs.driver_version }}-{{ inputs.dist }}
